<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Licensee Agreements - Horizon House</title>
  <link rel="stylesheet" href="staff-intake-agreements.css">
  <style>
    .page-video-bg{
      position:fixed;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
      opacity:.2;
      pointer-events:none;
      z-index:-1;
      filter:saturate(.8) brightness(.72);
    }
    body::before{
      content:'';
      position:fixed;
      inset:0;
      background:rgba(245,241,234,.68);
      pointer-events:none;
      z-index:-1;
    }
    .page-hero,main,footer{position:relative;z-index:1;}
    header{position:relative;z-index:50;}
    @media (prefers-reduced-motion: reduce){
      .page-video-bg{display:none;}
      body::before{background:rgba(245,241,234,.95);}
    }
  </style>
</head>
<body>
  <video class="page-video-bg" autoplay muted loop playsinline preload="metadata" poster="/sunrise1.jpg" aria-hidden="true">
    <source src="/uploads/IMG_0112_1_trim.mp4" type="video/mp4">
    <source src="/uploads/IMG_0112 (1).MOV" type="video/quicktime">
  </video>
  <div class="container">
    <h1>Licensee Agreements</h1>
    <div id="submissions"></div>
  </div>
  <script>
    const API_URL = 'https://horizon-portal-backend-production-3532.up.railway.app';
    async function loadSubmissions() {
      const res = await fetch(`${API_URL}/api/intake/licensee-agreement`);
      const data = await res.json();
      document.getElementById('submissions').innerHTML = data.length ? data.map(a => `<div class='submission'>${a.memberInfo?.firstName || ''} ${a.memberInfo?.lastName || ''} - ${a.signatureDate || ''}</div>`).join('') : '<p>No submissions yet.</p>';
    }
    loadSubmissions();
  </script>
<script src="/bg-video-autoplay.js" defer></script>
</body>
</html>
