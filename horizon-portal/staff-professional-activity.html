<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Professional Activity Log</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f7f9fc; color: #1f2937; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 24px; display: flex; flex-direction: column; gap: 24px; }
    .card { background: white; border-radius: 12px; box-shadow: 0 6px 24px rgba(0,0,0,0.06); padding: 20px; }
    h1 { margin-top: 0; font-size: 1.6rem; }
    h2 { margin-top: 0; font-size: 1.2rem; }
    .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
    button { padding: 10px 14px; border: none; border-radius: 8px; cursor: pointer; background: #1d4ed8; color: white; font-weight: 700; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid #e5e7eb; vertical-align: top; }
    th { background: #f3f4f6; font-size: 0.85rem; text-transform: uppercase; letter-spacing: .04em; }
    .muted { color: #6b7280; font-size: 0.9rem; }
    .pill { display: inline-block; padding: 3px 8px; border-radius: 999px; font-size: 0.8rem; background: #e0f2fe; color: #075985; font-weight: 700; }
    .empty { padding: 24px; text-align: center; color: #6b7280; }
    .badge { display: inline-block; background: #0f766e; color: white; border-radius: 999px; padding: 2px 10px; font-size: 0.8rem; font-weight: 700; margin-left: 8px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="toolbar">
        <div>
          <h1>Professional Activity Log</h1>
          <div class="muted">Staff view of professional portal activity and member interactions.</div>
        </div>
        <button onclick="loadAll()">↻ Refresh All</button>
      </div>
    </div>

    <!-- Registered Professionals -->
    <div class="card">
      <h2>Registered Professionals <span id="prosBadge" class="badge">0</span></h2>
      <div id="prosStatus" class="muted">Loading…</div>
      <div id="prosTableWrap"></div>
    </div>

    <!-- Activity Log -->
    <div class="card">
      <h2>Portal Activity Log</h2>
      <div id="status" class="muted">Loading…</div>
      <div id="tableWrap"></div>
    </div>
  </div>

  <script>
    const API = 'https://horizon-portal-backend-production-3532.up.railway.app/api';

    function loadAll() {
      loadPros();
      loadLog();
    }

    async function loadPros() {
      const status = document.getElementById('prosStatus');
      const wrap = document.getElementById('prosTableWrap');
      const badge = document.getElementById('prosBadge');
      status.textContent = 'Loading…';
      wrap.innerHTML = '';
      try {
        const res = await fetch(`${API}/members`);
        const all = await res.json();
        const pros = (Array.isArray(all) ? all : []).filter(m => m.professionalPortalAccess);
        badge.textContent = pros.length;
        if (!pros.length) {
          wrap.innerHTML = '<div class="empty">No registered professionals found.</div>';
          status.textContent = '';
          return;
        }
        const rows = pros.map(p => {
          const name = [p.firstName || p.FIRST_NAME || '', p.lastName || p.LAST_NAME || ''].join(' ').trim() || p.id || '—';
          const email = p.professionalEmail || p.email || '—';
          const org = p.professionalOrg || p.organization || '—';
          const id = p.id || p.ID || '—';
          const role = p.professionalRole || p.role || '—';
          return `<tr>
            <td style="font-weight:600">${escapeHtml(name)}</td>
            <td>${escapeHtml(id)}</td>
            <td>${escapeHtml(email)}</td>
            <td>${escapeHtml(org)}</td>
            <td>${escapeHtml(role)}</td>
          </tr>`;
        }).join('');
        wrap.innerHTML = `<table>
          <thead><tr>
            <th>Name</th><th>ID</th><th>Email</th><th>Organization</th><th>Role</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>`;
        status.textContent = `${pros.length} professional${pros.length !== 1 ? 's' : ''} registered.`;
      } catch (err) {
        status.textContent = 'Unable to load professionals.';
        wrap.innerHTML = '<div class="empty">Check backend connection.</div>';
      }
    }

    async function loadLog() {
      const status = document.getElementById('status');
      const wrap = document.getElementById('tableWrap');
      status.textContent = 'Loading…';
      wrap.innerHTML = '';
      try {
        const res = await fetch(`${API}/professional-activity`);
        const data = await res.json();
        if (!Array.isArray(data)) throw new Error('Unexpected response');
        if (!data.length) {
          wrap.innerHTML = '<div class="empty">No activity recorded yet. Activity is logged when professionals log in and view member records.</div>';
          status.textContent = 'No activity entries yet.';
          return;
        }
        const rows = data.map(item => {
          const ts = item.timestamp ? new Date(item.timestamp).toLocaleString() : '—';
          return `<tr>
            <td>${escapeHtml(ts)}</td>
            <td><strong>${escapeHtml(item.professionalName || item.professionalId || '—')}</strong><br><span class="muted">${escapeHtml(item.professionalEmail || '')}</span></td>
            <td><span class="pill">${escapeHtml(item.action || 'Activity')}</span></td>
            <td>${escapeHtml(item.memberName || item.memberID || '—')}</td>
            <td>${escapeHtml(item.details || '—')}</td>
          </tr>`;
        }).join('');
        wrap.innerHTML = `<table>
          <thead><tr>
            <th>Time</th><th>Professional</th><th>Action</th><th>Member</th><th>Details</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>`;
        status.textContent = `${data.length} entr${data.length === 1 ? 'y' : 'ies'} found.`;
      } catch (err) {
        status.textContent = 'Unable to load activity log.';
        wrap.innerHTML = '<div class="empty">Check that the backend is running.</div>';
      }
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    loadAll();
  </script>
</body>
</html>
