<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intake Package - Horizon House</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 700px;
            width: 100%;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            text-align: center;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 30px;
        }
        .btn-primary {
            padding: 18px 40px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 30px;
        }
        .btn-primary:hover {
            background: #5568d3;
        }
        .page-video-bg{
      position:fixed;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
      opacity:.2;
      pointer-events:none;
      z-index:0;
      filter:saturate(.8) brightness(.72);
    }
    body::before{
      content:'';
      position:fixed;
      inset:0;
      background:rgba(245,241,234,.68);
      pointer-events:none;
      z-index:0;
    }
    header,.page-hero,main,footer{position:relative;z-index:1;}
    @media (prefers-reduced-motion: reduce){
      .page-video-bg{display:none;}
      body::before{background:rgba(245,241,234,.95);}
    }
  </style>
</head>
<body>
  <video class="page-video-bg" autoplay muted loop playsinline preload="metadata" poster="sunrise1.jpg" aria-hidden="true">
    <source src="uploads/IMG_0112_1_trim.mp4" type="video/mp4">
    <source src="uploads/IMG_0112 (1).MOV" type="video/quicktime">
  </video>
    <div class="container">
        <div class="header">
            <h1>Intake Package</h1>
            <p>Begin the full intake process. Each form will open in sequence.</p>
        </div>
        <button class="btn-primary" id="startPackageBtn">Start Intake Package</button>
    </div>
    <script>
        document.getElementById('startPackageBtn').onclick = function() {
            window.location.href = 'intake/start-intake.html';
        };
    </script>
</body>
</html>
